<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Dataset Explorer</h2>

    <input id="search" class="search" placeholder="Search prompt..." />

    <select id="modelFilter" class="select"></select>
    <select id="datasetFilter" class="select"></select>
    <select id="impairmentFilter" class="select"></select>

  </div>

  <!-- GRID -->
  <div class="table-wrap">

    <div class="header-row">
      <div>Model</div>
      <div>Prompt</div>
      <div>Dataset</div>
    </div>

    <div id="table"></div>

  </div>

  <!-- PREVIEW -->
  <div class="preview">

    <img id="preview" />

    <div id="meta"></div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>

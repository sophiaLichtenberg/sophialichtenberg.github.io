<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sophia Lichtenberg</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ambient-bg"></div>
<div class="particles"></div>
<div class="cursor-glow"></div>

<div class="container">

<!-- HERO -->
<header class="hero">

  <img src="profile.jpg" class="avatar"/>

  <div>
    <h1>Sophia Lichtenberg</h1>

    <div class="subtitle">
      PhD Candidate · Human-Centered Computing · AI & Text-to-Image Models
    </div>

    <div class="buttons">
      <a class="btn" href="cv.pdf" download>📄 Download CV</a>
      <button class="btn ghost" onclick="toggleTheme()">🌙 Theme</button>
    </div>
  </div>

</header>

<!-- TABS -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="home">Home</button>
  <button class="tab-btn" data-tab="dataset">Dataset</button>
</nav>

<!-- HOME -->
<div id="home" class="tab-content active">
  <section>
    <h2>About</h2>
    <p>Human-centered AI research.</p>
  </section>
</div>

<!-- DATASET -->
<div id="dataset" class="tab-content">

  <section>

    <h2>Dataset Viewer</h2>

    <div class="dataset-layout">

      <!-- FILTERS -->
      <div class="dataset-filters">

        <div class="filter">
          <label>Search</label>
          <input id="searchInput">
        </div>

        <div class="filter">
          <label>Model</label>
          <input id="modelFilter">
        </div>

        <div class="filter">
          <label>Dataset</label>
          <input id="datasetFilter">
        </div>

      </div>

      <!-- GRID -->
      <div class="dataset-grid" id="grid"></div>

      <!-- PREVIEW -->
      <div class="dataset-preview">
        <img id="preview">
        <div class="dataset-info" id="info"></div>
      </div>

    </div>

  </section>

</div>

</div>

<script src="app.js"></script>

</body>
</html>

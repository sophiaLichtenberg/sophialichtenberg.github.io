<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
  APP LAYOUT
========================= -->

<div class="app">

  <!-- =========================
    SIDEBAR (FILTERS)
  ========================== -->
  <div class="sidebar">

    <h2>Dataset Explorer</h2>

    <p id="stats">Loading...</p>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Search prompt..."
    />

    <input
      id="modelFilter"
      class="search"
      list="models"
      placeholder="Filter by model"
    />
    <datalist id="models"></datalist>

    <input
      id="datasetFilter"
      class="search"
      list="datasets"
      placeholder="Filter by dataset"
    />
    <datalist id="datasets"></datalist>

  </div>

  <!-- =========================
    TABLE VIEW (VIRTUAL LIST)
  ========================== -->
  <div class="table-wrap">

    <div class="header-row">
      <div><b>Model</b></div>
      <div><b>Prompt</b></div>
      <div><b>Dataset</b></div>
    </div>

    <div id="table"></div>

  </div>

  <!-- =========================
    PREVIEW PANEL
  ========================== -->
  <div class="preview">

    <img id="preview" alt="preview image"/>

    <div id="meta">
      <b>No selection</b>
    </div>

  </div>

</div>

<!-- =========================
  SCRIPT
========================= -->
<script src="app.js"></script>

</body>
</html>

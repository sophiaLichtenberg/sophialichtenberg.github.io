<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>Dataset Explorer</h1>

  <!-- FILTER BAR -->
  <div class="controls">

    <input id="search" placeholder="Search prompts..." />

    <select id="modelFilter"></select>
    <select id="datasetFilter"></select>
    <select id="impairmentFilter"></select>

  </div>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- LEFT: GRID -->
    <div id="grid" class="grid"></div>

    <!-- RIGHT: DETAILS -->
    <div class="panel">

      <img id="preview" />

      <div id="meta" class="meta"></div>

    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sophia Lichtenberg</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- LEFT SIDEBAR -->
  <div class="sidebar">

    <h2>Dataset Explorer</h2>

    <button class="btn" onclick="openTab('home')">Home</button>
    <button class="btn ghost" onclick="openTab('dataset')">Dataset</button>

    <input id="search" class="search" placeholder="Search prompt..." />

    <select id="modelFilter" class="select"></select>
    <select id="datasetFilter" class="select"></select>
    <select id="impairmentFilter" class="select"></select>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HOME -->
    <div id="home" class="tab active">

      <div class="container">

        <header class="hero">
          <img src="profile.jpg" class="avatar"/>
          <div>
            <h1>Sophia Lichtenberg</h1>
            <div class="subtitle">
              PhD Candidate · AI & Text-to-Image Models
            </div>
          </div>
        </header>

      </div>
    </div>

    <!-- DATASET -->
    <div id="dataset" class="tab">

      <div class="table-wrap">

        <div class="header-row">
          <div>Model</div>
          <div>Prompt</div>
          <div>Dataset</div>
        </div>

        <div id="table"></div>

      </div>

    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="preview">

    <img id="preview" />
    <div id="meta"></div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Grid Viewer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Filters</h2>

    <input id="search" class="search" placeholder="Search prompt..." />

    <select id="modelFilter" class="select"></select>
    <select id="datasetFilter" class="select"></select>
    <select id="impairmentFilter" class="select"></select>

    <button class="btn ghost" onclick="openTab('home')">Home</button>
    <button class="btn" onclick="openTab('dataset')">Dataset</button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HOME -->
    <div id="home" class="tab active">
      <div class="container">
        <h1>Sophia Lichtenberg</h1>
        <p>Human-centered AI research.</p>
      </div>
    </div>

    <!-- GRID TAB -->
    <div id="dataset" class="tab">

      <div class="grid-wrap" id="grid"></div>

    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="preview">

    <img id="preview" />
    <div id="meta"></div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Dataset Explorer</h2>

    <p id="stats">Loading...</p>

    <!-- SEARCH (IMPORTANT: id MUST match JS) -->
    <input id="search" class="search" placeholder="Search prompt..." />

    <!-- MODEL DROPDOWN -->
    <label>Model</label>
    <select id="modelFilter" class="select">
      <option value="">All models</option>
    </select>

    <!-- DATASET DROPDOWN -->
    <label>Dataset</label>
    <select id="datasetFilter" class="select">
      <option value="">All datasets</option>
    </select>

  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <div class="header-row">
      <div>Model</div>
      <div>Prompt</div>
      <div>Dataset</div>
    </div>

    <div id="table"></div>
  </div>

  <!-- PREVIEW -->
  <div class="preview">
    <img id="preview" />
    <div id="meta">Select an item</div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Explorer</h2>

    <input id="search" class="search" placeholder="Search prompts..." />

    <select id="modelFilter" class="select"></select>
    <select id="datasetFilter" class="select"></select>
    <select id="impairmentFilter" class="select"></select>

    <button id="searchBtn" class="btn">Search</button>

    <div class="tab-buttons">
      <button class="btn ghost" onclick="switchTab('home')">Home</button>
      <button class="btn ghost" onclick="switchTab('dataset')">Dataset</button>
    </div>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HOME -->
    <div id="home" class="tab active">
      <h1>Dataset Explorer</h1>
      <p>Search and inspect image generation results.</p>
    </div>

    <!-- DATASET -->
    <div id="dataset" class="tab">

      <div class="dataset-layout">

        <!-- LEFT: GRID -->
        <div class="table-wrap">

          <div class="header-row">
            <div>Model</div>
            <div>Prompt</div>
            <div>Dataset</div>
          </div>

          <div id="table"></div>

        </div>

        <!-- RIGHT: PREVIEW -->
        <div class="preview">

          <div id="loader" class="loader hidden"></div>

          <img id="previewImg" />

          <div id="meta"></div>

        </div>

      </div>
    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>

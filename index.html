<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app-root">

  <!-- TABS -->
  <div class="tabs">
    <button data-tab="home">Home</button>
    <button data-tab="dataset">Dataset</button>
  </div>

  <!-- HOME -->
  <section class="tab" id="home">
    <h1>Home</h1>
  </section>

  <!-- DATASET -->
  <section class="tab" id="dataset">

    <div class="layout">

      <div class="sidebar">
        <input id="search" placeholder="Search..." />
        <select id="modelFilter"></select>
        <select id="datasetFilter"></select>
        <select id="impairmentFilter"></select>
      </div>

      <div id="grid" class="grid"></div>

      <div class="preview">
        <img id="preview" />
        <div id="meta"></div>
      </div>

    </div>

  </section>

</div>

<script src="app.js"></script>
</body>
</html>

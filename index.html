<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Dataset Explorer</h2>

    <input id="search" class="search" placeholder="Search prompts..." />

    <select id="modelFilter" class="select"></select>
    <select id="datasetFilter" class="select"></select>
    <select id="impairmentFilter" class="select"></select>

    <button class="btn" onclick="switchTab('grid')">Grid</button>
    <button class="btn ghost" onclick="switchTab('dataset')">Table</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- GRID TAB -->
    <div id="gridTab" class="tab active">
      <div id="grid" class="grid"></div>
    </div>

    <!-- TABLE TAB -->
    <div id="datasetTab" class="tab">
      <div class="table-wrap">
        <div class="header-row">
          <div>Model</div>
          <div>Prompt</div>
          <div>Dataset</div>
        </div>

        <div id="table"></div>
      </div>
    </div>

  </div>

  <!-- PREVIEW -->
  <div class="preview">

    <div id="loader" class="loader"></div>

    <img id="previewImg" />

    <div id="meta"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>

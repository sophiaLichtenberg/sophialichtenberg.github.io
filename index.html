<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP NAV -->
<nav class="topbar">
  <button class="tab-btn active" onclick="openTab('home', this)">Home</button>
  <button class="tab-btn" onclick="openTab('dataset', this)">Dataset</button>
</nav>

<!-- BACKGROUND -->
<div class="ambient-bg"></div>
<div class="particles"></div>
<div class="cursor-glow"></div>

<div class="container">

<!-- ================= HOME ================= -->
<div id="home" class="tab active">

  <header class="hero">
    <img src="profile.jpg" class="avatar" />

    <div>
      <h1>Sophia Lichtenberg</h1>
      <div class="subtitle">
        PhD Candidate · AI & Text-to-Image Models
      </div>
    </div>
  </header>

  <section>
    <h2>About</h2>
    <p>Human-centered evaluation of generative AI systems.</p>
  </section>

</div>

<!-- ================= DATASET ================= -->
<div id="dataset" class="tab">

  <div class="dataset-layout">

    <!-- LEFT -->
    <div class="sidebar">

      <input id="search" class="search" placeholder="Search prompts..." />

      <select id="modelFilter"></select>
      <select id="datasetFilter"></select>
      <select id="impairmentFilter"></select>

      <div class="header-row">
        <div>Model</div>
        <div>Prompt</div>
        <div>Dataset</div>
      </div>

      <div id="table"></div>
    </div>

    <!-- RIGHT -->
    <div class="preview">
      <img id="preview" />
      <div id="meta"></div>
    </div>

  </div>

</div>

</div>

<script src="app.js"></script>
</body>
</html>

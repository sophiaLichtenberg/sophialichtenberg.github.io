<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sophia Lichtenberg</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ambient-bg"></div>
<div class="particles"></div>
<div class="cursor-glow"></div>

<div class="container">

  <!-- HEADER -->
  <header class="hero">
    <img src="profile.jpg" class="avatar" />

    <div>
      <h1>Sophia Lichtenberg</h1>

      <div class="subtitle">
        PhD Candidate · AI & Text-to-Image Models
      </div>

      <div class="buttons">
        <button class="btn" onclick="openTab('home')">Home</button>
        <button class="btn" onclick="openTab('dataset')">Dataset</button>
      </div>
    </div>
  </header>

  <!-- ================= HOME TAB ================= -->
  <div id="home" class="tab active">

    <section>
      <h2>About</h2>
      <p>Human-centered evaluation of generative AI systems.</p>
    </section>

    <section>
      <h2>Research</h2>
      <span class="tag">Text-to-Image</span>
      <span class="tag">Fairness</span>
      <span class="tag">Evaluation</span>
    </section>

  </div>

  <!-- ================= DATASET TAB ================= -->
  <div id="dataset" class="tab">

    <div class="dataset-layout">

      <!-- LEFT: TABLE -->
      <div class="table">
        <div id="tableHeader" class="row header">
          <div>Model</div>
          <div>Prompt</div>
          <div>Dataset</div>
        </div>

        <div id="tableBody"></div>
      </div>

      <!-- RIGHT: PREVIEW -->
      <div class="preview">

        <img id="previewImg" />

        <div id="meta"></div>

      </div>

    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>

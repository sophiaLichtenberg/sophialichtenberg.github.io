<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <input id="search" class="search" placeholder="Search prompts..." />

    <select id="modelFilter" class="select"></select>
    <select id="datasetFilter" class="select"></select>
    <select id="biasFilter" class="select"></select>
    <select id="contextFilter" class="select"></select>
    <select id="impairmentFilter" class="select"></select>

    <button id="searchBtn" class="btn">Search</button>

    <button class="btn ghost" onclick="setView('grid')">Grid</button>
    <button class="btn ghost" onclick="setView('table')">Table</button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div id="gridView" class="grid"></div>

    <div id="tableView">
      <div class="row header">
        <div>Model</div>
        <div>Prompt</div>
        <div>Dataset</div>
      </div>
      <div id="table"></div>
    </div>

  </div>

  <!-- PREVIEW -->
  <div class="preview">
    <div id="loader" class="loader hidden"></div>
    <img id="previewImg" />
    <div id="meta"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>

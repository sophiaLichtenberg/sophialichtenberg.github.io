<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sophia Lichtenberg</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ambient-bg"></div>
<div class="particles"></div>
<div class="cursor-glow"></div>

<div class="container">

<!-- ================= HERO ================= -->
<header class="hero">

  <img src="profile.jpg" class="avatar" />

  <div>
    <h1>Sophia Lichtenberg</h1>

    <div class="subtitle">
      PhD Candidate · Human-Centered Computing · AI & Text-to-Image Models
    </div>

    <div class="buttons">
      <a class="btn" href="cv.pdf" download>📄 Download CV</a>
      <button class="btn ghost" onclick="toggleTheme()">🌙 Theme</button>
    </div>
  </div>

</header>

<!-- ================= TABS ================= -->
<nav class="tabs">
  <button class="tab-btn active" onclick="openTab(event,'home')">Home</button>
  <button class="tab-btn" onclick="openTab(event,'dataset')">Dataset</button>
</nav>

<!-- ================= HOME ================= -->
<div id="home" class="tab-content active">

  <section>
    <h2>About</h2>
    <p>Human-centered evaluation of generative AI systems.</p>
  </section>

</div>

<!-- ================= DATASET ================= -->
<div id="dataset" class="tab-content">

<section>

<h2>Dataset Viewer</h2>

<div class="dataset-layout">

  <!-- LEFT: FILTERS -->
  <div class="dataset-filters">

    <div class="filter">
      <label>Search prompt</label>
      <input id="searchInput" placeholder="type prompt..." />
    </div>

    <div class="filter">
      <label>Model</label>
      <input id="modelFilter" placeholder="FLUX_schnell..." />
    </div>

    <div class="filter">
      <label>Dataset type</label>
      <input id="datasetFilter" placeholder="No_Context..." />
    </div>

  </div>

  <!-- CENTER: GRID -->
  <div class="dataset-grid" id="grid"></div>

  <!-- RIGHT: PREVIEW -->
  <div class="dataset-preview">

    <img id="preview" />

    <div class="dataset-info" id="info">
      Click an image
    </div>

  </div>

</div>

</section>

</div>

</div>

<!-- ================= JS ================= -->
<script>

function openTab(e,id){

  document.querySelectorAll(".tab-content")
    .forEach(t=>t.classList.remove("active"));

  document.querySelectorAll(".tab-btn")
    .forEach(b=>b.classList.remove("active"));

  document.getElementById(id).classList.add("active");
  e.target.classList.add("active");
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* ================= DATA ================= */

const base =
"https://surfdrive.surf.nl/s/YS6PcXjL9Rs2c3J/download?files=";

const data = [
{
  file:"image_0",
  model:"FLUX_schnell",
  prompt:"Photo of a Person",
  dataset:"No_Context_no_Bias",
  hash:"11208126882101814974"
},
{
  file:"image_1",
  model:"FLUX_schnell",
  prompt:"Photo of a Person",
  dataset:"No_Context_no_Bias",
  hash:"14082437164622650326"
},
{
  file:"image_2",
  model:"FLUX_schnell",
  prompt:"Photo of a Person",
  dataset:"No_Context_no_Bias",
  hash:"10797990572701187062"
}
];

const grid = document.getElementById("grid");
const preview = document.getElementById("preview");
const info = document.getElementById("info");

/* ================= RENDER ================= */

function render(list){

  grid.innerHTML = "";

  list.forEach(item=>{

    const div = document.createElement("div");
    div.className = "dataset-card";

    div.innerHTML = `
      <img src="${base + item.hash + ".png"}">
      <small>${item.model}</small>
    `;

    div.onclick = ()=>{

      preview.src = base + item.hash + ".png";

      info.innerHTML = `
        <b>${item.model}</b><br>
        ${item.prompt}<br>
        ${item.dataset}
      `;
    };

    grid.appendChild(div);

  });

}

/* ================= FILTER ================= */

function applyFilter(){

  const s = searchInput.value.toLowerCase();
  const m = modelFilter.value.toLowerCase();
  const d = datasetFilter.value.toLowerCase();

  const filtered = data.filter(x=>
    x.prompt.toLowerCase().includes(s) &&
    x.model.toLowerCase().includes(m) &&
    x.dataset.toLowerCase().includes(d)
  );

  render(filtered);
}

searchInput.oninput = applyFilter;
modelFilter.oninput = applyFilter;
datasetFilter.oninput = applyFilter;

/* INIT */

render(data);

if(data.length){
  preview.src = base + data[0].hash + ".png";
  info.innerHTML = data[0].model;
}

</script>

</body>
</html>

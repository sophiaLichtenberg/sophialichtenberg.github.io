<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dataset Explorer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ambient-bg"></div>
<div class="particles"></div>
<div class="cursor-glow"></div>

<div class="container">

<!-- HERO -->
<header class="hero">
  <div>
    <h1>Dataset Explorer</h1>
    <div class="subtitle">Interactive image dataset viewer</div>
  </div>
</header>

<!-- TABS -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="home">Home</button>
  <button class="tab-btn" data-tab="dataset">Dataset</button>
</nav>

<!-- HOME -->
<div id="home" class="tab-content active">
  <section>
    <h2>Home</h2>
    <p>Welcome to the dataset viewer.</p>
  </section>
</div>

<!-- DATASET -->
<div id="dataset" class="tab-content">

<section>

<h2>Dataset Viewer</h2>

<div class="dataset-layout">

  <!-- FILTER PANEL -->
  <div class="dataset-filters">

    <div class="filter">
      <label>Search prompt</label>
      <input id="searchInput" placeholder="type prompt..." />
    </div>

    <div class="filter">
      <label>Model</label>
      <input id="modelFilter" list="modelList" placeholder="type or select..." />
      <datalist id="modelList"></datalist>
    </div>

    <div class="filter">
      <label>Dataset</label>
      <input id="datasetFilter" list="datasetList" placeholder="type or select..." />
      <datalist id="datasetList"></datalist>
    </div>

  </div>

  <!-- GRID -->
  <div class="dataset-grid" id="grid"></div>

  <!-- PREVIEW -->
  <div class="dataset-preview">

    <img id="preview" />

    <div class="dataset-info" id="info">
      Click an image
    </div>

  </div>

</div>

</section>

</div>

</div>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sophia Lichtenberg</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ambient-bg"></div>
<div class="particles"></div>
<div class="cursor-glow"></div>

<div class="container">

<!-- HERO -->
<header class="hero">

  <img src="profile.jpg" class="avatar" />

  <div>
    <h1>Sophia Lichtenberg</h1>

    <div class="buttons">
      <a class="btn" href="cv.pdf" download>📄 CV</a>
      <button class="btn ghost" onclick="toggleTheme()">🌙 Theme</button>
    </div>
  </div>

</header>

<!-- TABS -->
<nav class="tabs">
  <button class="tab-btn active" onclick="openTab('home', event)">
    Home
  </button>

  <button class="tab-btn" onclick="openTab('dataset', event)">
    Dataset Viewer
  </button>
</nav>

<!-- HOME TAB -->
<div id="home" class="tab-content active">

  <section>
    <h2>About</h2>
    <p>Human-centered AI research on text-to-image models.</p>
  </section>

</div>

<!-- DATASET TAB -->
<div id="dataset" class="tab-content">

  <section>
    <h2>Dataset Viewer</h2>

    <div class="dataset-layout">

      <!-- TABLE -->
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Model</th>
              <th>Prompt</th>
              <th>Dataset</th>
              <th>Hash</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- PREVIEW -->
      <div class="image-panel">

        <img id="preview" />

        <div class="dataset-meta" id="meta">
          Click a row to preview image
        </div>

      </div>

    </div>

  </section>

</div>

</div>

<script>

/* =========================
   TABS
========================= */

function openTab(id, event){

  document.querySelectorAll(".tab-content")
    .forEach(t => t.classList.remove("active"));

  document.querySelectorAll(".tab-btn")
    .forEach(b => b.classList.remove("active"));

  document.getElementById(id).classList.add("active");

  event.currentTarget.classList.add("active");
}

/* =========================
   DATASET
========================= */

const surfdriveBase =
  "https://surfdrive.surf.nl/s/YS6PcXjL9Rs2c3J/download?files=";

const data = [
{
  model:"FLUX_schnell",
  prompt:"Photo of a Person",
  dataset_type:"No_Context_no_Bias",
  hash_name:"11208126882101814974"
},
{
  model:"FLUX_schnell",
  prompt:"Photo of a Person",
  dataset_type:"No_Context_no_Bias",
  hash_name:"14082437164622650326"
},
{
  model:"FLUX_schnell",
  prompt:"Photo of a Person",
  dataset_type:"No_Context_no_Bias",
  hash_name:"10797990572701187062"
}
];

const tbody = document.querySelector("#dataTable tbody");

data.forEach(row => {

  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td>${row.model}</td>
    <td>${row.prompt}</td>
    <td>${row.dataset_type}</td>
    <td>${row.hash_name}</td>
  `;

  tr.onclick = () => {

    document.getElementById("preview").src =
      surfdriveBase + row.hash_name + ".png";

    document.getElementById("meta").innerHTML = `
      <b>Model:</b> ${row.model}<br>
      <b>Dataset:</b> ${row.dataset_type}<br>
      <b>Hash:</b> ${row.hash_name}
    `;
  };

  tbody.appendChild(tr);

});

/* default image */
if(data.length){
  document.getElementById("preview").src =
    surfdriveBase + data[0].hash_name + ".png";
}

/* theme toggle */
function toggleTheme(){
  document.body.classList.toggle("light");
}

</script>

</body>
</html>

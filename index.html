<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dataset Explorer</title>

  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Dataset Explorer</h2>

    <input id="search" class="search" placeholder="Search prompts..." />

    <select id="modelFilter" class="select"></select>
    <select id="datasetFilter" class="select"></select>
    <select id="impairmentFilter" class="select"></select>

  </div>

  <!-- TABLE -->
  <div class="table-wrap">

    <div class="header-row">
      <div>Model</div>
      <div>Prompt</div>
      <div>Dataset</div>
    </div>

    <div id="table"></div>

  </div>

  <!-- PREVIEW -->
  <div class="preview">

    <img id="gallery" />
    <div id="meta">Click a row</div>

  </div>

</div>

</body>
</html>
